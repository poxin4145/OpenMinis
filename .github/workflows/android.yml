name: android

# Builds the Android app on every push to a feature branch and on every tag.
#
# The upstream project builds locally only (see BUILDING.md): the sandbox
# binaries (proot), the Alpine rootfs and the rclone binding are build
# artefacts, not checked in. This workflow reproduces the documented steps on
# a GitHub runner so a change can be verified without a local NDK + Go setup,
# and a tag additionally publishes a debug APK.
#
# Two jobs: `verify` compiles the Kotlin and runs the unit tests as soon as
# the native inputs exist; `apk` only runs for tags and uploads the APK.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
  ANDROID_API: 26

jobs:
  verify:
    name: Compile + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # deps/proot and deps/ish are submodules of the native build.
          submodules: recursive

      - name: Show toolchain
        run: |
          echo "NDK (latest): $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME" | head -3
          java -version 2>&1 | head -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build native inputs (proot, rootfs, rclone)
        working-directory: .
        run: |
          # ANDROID_NDK_LATEST_HOME / ANDROID_HOME are set by the runner image.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?runner has no NDK}"
          echo "NDK: $ANDROID_NDK_HOME"
          # The three artefacts BUILDING.md asks for, in its order.
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Compile Kotlin + resources
        working-directory: src/android
        run: ./gradlew :app:compileGithubDebugKotlin --no-daemon --stacktrace

      - name: Unit tests
        working-directory: src/android
        run: ./gradlew :app:testGithubDebugUnitTest --no-daemon --stacktrace

      - name: Report failing tests
        if: always()
        run: python3 scripts/ci_print_test_failures.py 'src/android/app/build/test-results/testGithubDebugUnitTest/TEST-*.xml'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: src/android/app/build/reports/tests/testGithubDebugUnitTest/
          if-no-files-found: ignore

  apk:
    name: Debug APK (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build native inputs
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?runner has no NDK}"
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Assemble debug APK
        working-directory: src/android
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Rename with version and commit
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' src/android/app/build.gradle.kts)
          SHA=${GITHUB_SHA::10}
          mkdir -p dist
          for f in src/android/app/build/outputs/apk/github/debug/*.apk; do
            cp "$f" "dist/OpenMinis-${VERSION}-${SHA}-debug.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
