name: android

# Builds the Android app on every push to a feature branch and on every tag.
#
# The upstream project builds locally only (see BUILDING.md): the sandbox
# binaries (proot), the Alpine rootfs and the rclone binding are build
# artefacts, not checked in. This workflow reproduces the documented steps on
# a GitHub runner so a change can be verified without a local NDK + Go setup,
# and a tag additionally publishes the release-variant APK.
#
# Two jobs: `verify` compiles the Kotlin and runs the unit tests as soon as
# the native inputs exist; `apk` only runs for tags and uploads the APK.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only the daemon switch: the heap sizes come from the "Raise compiler
  # memory" step, which writes them into the checkout's gradle.properties.
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  ANDROID_API: 26

jobs:
  verify:
    name: Compile + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # deps/proot and deps/ish are submodules of the native build.
          submodules: recursive

      - name: Show toolchain
        run: |
          echo "NDK (latest): $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME" | head -3
          java -version 2>&1 | head -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build native inputs (proot, rootfs, rclone)
        working-directory: .
        run: |
          # ANDROID_NDK_LATEST_HOME / ANDROID_HOME are set by the runner image.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?runner has no NDK}"
          echo "NDK: $ANDROID_NDK_HOME"
          # The three artefacts BUILDING.md asks for, in its order.
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Raise compiler memory
        # The project ships org.gradle.jvmargs=-Xmx2048m and no Kotlin daemon
        # size. ChatViewModel.kt alone is 1.1 MB, and the default Kotlin
        # daemon dies with "Not enough memory to run compilation" on that.
        # Nothing here is committed: this appends to the checkout's own
        # gradle.properties, which only this job sees.
        run: |
          f=src/android/gradle.properties
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'kotlin.daemon.jvmargs=-Xmx4g' >> "$f"
          cat "$f"

      - name: Compile Kotlin + resources
        working-directory: src/android
        run: ./gradlew :app:compileGithubDebugKotlin --no-daemon --stacktrace

      - name: Unit tests (GitHub tools)
        # The suite this change touches, first and on its own: it is the only
        # part of the run that can prove the new grant logic, and it finishes
        # in seconds where the full suite takes over half an hour.
        #
        # Skipped on a tag: the tag points at a commit this workflow already
        # verified on the branch push, and a tag build exists to produce the
        # APK.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: src/android
        run: >
          ./gradlew :app:testGithubDebugUnitTest --no-daemon --stacktrace
          --tests 'com.openminis.app.github.*'

      - name: Unit tests (full suite)
        # The rest of the project's tests. Not what this branch is about, and
        # long enough that a slow or flaky case would hide the result above,
        # so a failure here is reported but does not fail the job.
        #
        # The step has its own ceiling: without one, a suite that overruns
        # eats the job's 60-minute budget and the job is cancelled — which
        # turns the branch red even though `continue-on-error` is set. A
        # step timeout is a normal failure, so continue-on-error covers it.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        timeout-minutes: 25
        working-directory: src/android
        run: ./gradlew :app:testGithubDebugUnitTest --no-daemon --stacktrace

      - name: Report failing tests
        if: always()
        run: python3 scripts/ci_print_test_failures.py 'src/android/app/build/test-results/testGithubDebugUnitTest/TEST-*.xml'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: src/android/app/build/reports/tests/testGithubDebugUnitTest/
          if-no-files-found: ignore

  apk:
    name: APK (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build native inputs
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?runner has no NDK}"
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Raise compiler memory
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'kotlin.daemon.jvmargs=-Xmx4g' >> src/android/gradle.properties

      - name: Assemble APK
        working-directory: src/android
        run: ./gradlew :app:assembleGithubRelease --no-daemon --stacktrace

      - name: Rename with version and commit
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' src/android/app/build.gradle.kts)
          SHA=${GITHUB_SHA::10}
          mkdir -p dist
          for f in src/android/app/build/outputs/apk/github/release/*.apk; do
            cp "$f" "dist/OpenMinis-${VERSION}-${SHA}-apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
